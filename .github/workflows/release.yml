name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test GuardianAngel.sln -c Release
      - name: Build Release installer
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Version ("${{ github.ref_name }}".TrimStart('v'))
      # Code signing: add a signing step here once a certificate is available (see docs/CODE-SIGNING.md).
      # Releases must never be built in Debug configuration.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/GuardianAngel-*.msi
          draft: true
          generate_release_notes: true
